name: Deployment
on:
  push:
    branches:
      - main
      - dev
      - master
env:
  MONGODB_DB_NAME: ChatBotHackathon
jobs:
  test:
    environment: testing
    env:
      MONGODB_CLUSTER_ADDRESS: chatbothackathon.mrho6.mongodb.net
      MONGODB_USERNAME: anirbans
      MONGODB_PASSWORD: xTuOwRuxariY6Lsw
      PORT: 3000
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME}}"
          echo "MONGODB_DB_NAME: ${{ env.MONGODB_DB_NAME}}"
